name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The OpenCode version the plugin was tested with, as in the README.
  OPENCODE_TESTED: 2.2.5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the Bun that built the committed dist/.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run bundle
      - name: Check that dist/ is up to date
        run: git diff --exit-code -- dist

  # The plugin in a real OpenCode TUI, in a pseudo-terminal. No model is called.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyte
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$OPENCODE_TESTED" --no-modify-path
      - run: python3 scripts/smoke.py --opencode "$HOME/.opencode/bin/opencode"
